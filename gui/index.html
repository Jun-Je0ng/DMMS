<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DMMS — MUL Baggage Routing</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="kiosk">

    <header class="topbar">
      <div class="brand">
        <img
          class="brand-logo"
          src="resources/Generated image_ SAAS Airport Automation Logo (1).png"
          alt="Sydney Airport Automation Systems"
        />
        <div class="brand-text">
          <h1>MUL Baggage Routing</h1>
          <p class="muted">Make-Up Line &middot; Can Assignment Board</p>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-tile">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Scanned</span>
        </div>
        <div class="stat-tile stat-accent">
          <span class="stat-value" id="stat-routed">0</span>
          <span class="stat-label">In a Can</span>
        </div>
        <div class="stat-tile stat-flagged">
          <span class="stat-value" id="stat-flagged">0</span>
          <span class="stat-label">Needs Attention</span>
        </div>
        <div class="stat-tile stat-good">
          <span class="stat-value" id="stat-loaded">0</span>
          <span class="stat-label">Loaded</span>
        </div>
      </div>
    </header>

    <div class="mock-banner" id="mode-banner">
      <strong>MOCK DATA</strong> &mdash; stepping through <code>mock_events.json</code>.
      Double-click a photo once loaded to clear it.
    </div>

    <main class="board">
      <div class="quadrants" id="quadrants">
        <!-- quadrant sections injected by app.js -->
      </div>
    </main>

    <footer class="footbar">
      <div class="demo-controls" aria-label="Demo playback controls (mock data only)">
        <button id="btn-prev" title="Previous bag">&#8592;</button>
        <button id="btn-play" title="Play / pause">&#9654;</button>
        <button id="btn-next" title="Next bag">&#8594;</button>
        <span class="demo-label">demo &middot; mock_events.json</span>
      </div>
      <button id="btn-manage-cans" class="footer-button add-can-button" title="Open can management">&#9776; Manage Cans</button>
      <button id="btn-open-attention" class="footer-button attention-open-button" title="Open the Needs Attention tray">Needs Attention &#8599;</button>
      <button id="btn-reset" class="footer-button reset-button" title="Clear every tile currently shown">Reset Board</button>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
