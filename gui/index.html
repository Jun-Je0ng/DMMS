<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUL Baggage Routing</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="kiosk">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>MUL Baggage Routing</h1>
          <p class="muted">Make-Up Line &middot; can assignment board</p>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-tile">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Scanned</span>
        </div>
        <div class="stat-tile stat-accent">
          <span class="stat-value" id="stat-routed">0</span>
          <span class="stat-label">In a can</span>
        </div>
        <div class="stat-tile stat-flagged">
          <span class="stat-value" id="stat-flagged">0</span>
          <span class="stat-label">Needs attention</span>
        </div>
        <div class="stat-tile stat-good">
          <span class="stat-value" id="stat-loaded">0</span>
          <span class="stat-label">Loaded</span>
        </div>
      </div>
    </header>

    <div class="mock-banner" id="mode-banner">
      <strong>MOCK DATA</strong>: stepping through <code>mock_events.json</code>. Double-click a photo to clear it once loaded.
    </div>

    <main class="board">
      <div class="quadrants" id="quadrants">
        <!-- 4 quadrant sections injected by app.js -->
      </div>

      <section class="attention-tray card">
        <h2 class="card-title">Needs Attention: no can match, handle by hand</h2>
        <div class="tile-grid" id="attention-grid"></div>
      </section>
    </main>

    <footer class="footbar">
      <div class="demo-controls" aria-label="Demo playback controls (mock data only)">
        <button id="btn-prev" title="Previous bag">&#8592;</button>
        <button id="btn-play" title="Play / pause">&#9654;</button>
        <button id="btn-next" title="Next bag">&#8594;</button>
        <span class="demo-label">demo controls &middot; steps through mock_events.json</span>
      </div>
      <button id="btn-reset" class="reset-button" title="Clear every tile currently shown">Reset board</button>
    </footer>

  </div>

  <div class="zoom-overlay" id="zoom-overlay" hidden>
    <img id="zoom-image" alt="" />
    <div class="zoom-caption" id="zoom-caption"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
