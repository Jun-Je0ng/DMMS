<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flights</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="page">

  <header class="topbar" style="margin: 0 24px;">
    <div class="brand">
      <span class="brand-mark"></span>
      <div class="brand-text">
        <h1>Flights</h1>
        <p class="muted">Admin · Manage Flights</p>
      </div>
    </div>
    <div class="topbar-nav">
      <a class="btn" href="/admin">Admin Dashboard</a>
    </div>
  </header>

  <div class="page-body">

    <div class="page-header">
      <a href="/admin/flights/add" class="btn btn-good">+ Add Flight</a>
    </div>

    <table>
      <thead>

        <tr>
          <th>ID</th>
          <th>Flight</th>
          <th>Destination</th>
          <th>Gate</th>
          <th>Departure</th>
          <th>Actions</th>
        </tr>

      </thead>


      <tbody>

        {% for f in flights %}

          <tr>

            <td>
              {{ f[0] }}
            </td>

            <td>
              {{ f[1] }}
            </td>

            <td>
              {{ f[3] }}
            </td>

            <td>
              {{ f[4] }}
            </td>

            <td>
              {{ f[2] }}
            </td>

            <td>

              <div class="actions">

                <a
                  href="/admin/flights/edit/{{ f[0] }}"
                  class="btn btn-primary"
                >
                  Edit
                </a>


                <form
                  action="/admin/flights/delete/{{ f[0] }}"
                  method="POST"
                  onsubmit="return confirm('Delete flight {{ f[1] }}?');"
                >

                  <button
                    type="submit"
                    class="btn btn-danger"
                  >
                    Delete
                  </button>

                </form>

              </div>

            </td>

          </tr>

        {% else %}

          <tr>

            <td colspan="6" class="empty-state">
              No flights configured.
            </td>

          </tr>

        {% endfor %}

      </tbody>

    </table>

  </div>
</div>
</body>
</html>
