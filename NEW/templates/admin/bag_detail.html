<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bag {{ bag[1] }} — Details</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    img { border-radius: 8px; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.5rem 0; border-bottom: 1px solid #444; }
  </style>
</head>
<body>

<h1>Bag {{ bag[1] }}</h1>

<img src="/{{ bag[2] }}" style="width:300px">

<p><strong>Flight:</strong> {{ bag[4] }} → {{ bag[5] }}</p>

<h2>History</h2>

<ul>
  {% for e in events %}
    <li>
      <strong>{{ e[0] }}</strong> —
      {{ e[3] }} —
      by user {{ e[1] }} —
      at {{ e[2] | datetime }}
    </li>
  {% endfor %}
</ul>

</body>
</html>
