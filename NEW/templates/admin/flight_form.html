<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if flight %}Edit Flight{% else %}Add Flight{% endif %}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
  <div class="page">

    <header class="topbar" style="margin: 0 24px;">
      <div class="brand">
        <span class="brand-mark"></span>
        <div class="brand-text">
          <h1>{% if flight %}Edit Flight{% else %}Add Flight{% endif %}</h1>
          <p class="muted">Admin · Flights</p>
        </div>
      </div>
      <div class="topbar-nav">
        <a class="btn" href="/admin">Admin Dashboard</a>
      </div>
    </header>

    <div class="page-body">

      <form
        class="stacked-form"
        method="POST"
        {% if flight %}
          action="/admin/flights/edit/{{ flight[0] }}"
        {% else %}
          action="/admin/flights/add"
        {% endif %}
      >
        <div class="form-field">
          <label for="flight_number">Flight Number</label>
          <input
            type="text"
            id="flight_number"
            name="flight_number"
            required
            value="{{ flight[1] if flight else '' }}"
            placeholder="e.g. QF123"
          >
        </div>

        <div class="form-field">
          <label for="destination">Destination</label>
          <input
            type="text"
            id="destination"
            name="destination"
            required
            value="{{ flight[3] if flight else '' }}"
            placeholder="e.g. Sydney"
          >
        </div>

        <div class="form-field">
          <label for="gate_number">Gate</label>
          <input
            type="text"
            id="gate_number"
            name="gate_number"
            value="{{ flight[4] if flight else '' }}"
            placeholder="e.g. 24"
          >
        </div>

        <div class="form-field">
          <label for="departure_time">Departure Time</label>
          <input
            type="datetime-local"
            id="departure_time"
            name="departure_time"
            required
            value="{{ flight[2] if flight else '' }}"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          {% if flight %}Save Changes{% else %}Add Flight{% endif %}
        </button>
      </form>

      <p><a href="/admin/flights">← Back to Flights</a></p>
    </div>
  </div>
  </body>
</html>
