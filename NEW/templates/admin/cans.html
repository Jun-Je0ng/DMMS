<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manage CAN Assignments</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #444; }
    select { padding: 0.3rem; }
    button { padding: 0.4rem 1rem; margin-left: 0.5rem; }
  </style>
</head>
<body>

<h1>CAN Assignment</h1>

<table>
  <tr>
    <th>CAN ID</th>
    <th>MUL</th>
    <th>Flight</th>
    <th>Save</th>
  </tr>

  {% for can in cans %}
  <tr>
    <form action="/admin/cans/update" method="POST">
      <td>{{ can[0] }}</td>

      <!-- MUL Dropdown -->
      <td>
        <select name="mul_id">
          {% for m in muls %}
            <option value="{{ m[0] }}" {% if m[0] == can[1] %}selected{% endif %}>
              {{ m[1] }}
            </option>
          {% endfor %}
        </select>
      </td>

      <!-- Flight Dropdown -->
      <td>
        <select name="flight_id">
          {% for f in flights %}
            <option value="{{ f[0] }}" {% if f[0] == can[2] %}selected{% endif %}>
              {{ f[1] }} → {{ f[2] }}
            </option>
          {% endfor %}
        </select>
      </td>

      <td>
        <input type="hidden" name="can_id" value="{{ can[0] }}">
        <button type="submit">Save</button>
      </td>
    </form>
  </tr>
  {% endfor %}
</table>

</body>
</html>
